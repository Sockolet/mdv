name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev xvfb xauth xdotool xdg-utils xdg-desktop-portal zenity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Scroll performance
        run: cargo test --release --locked scroll_frame_benchmark -- --ignored --nocapture
      - name: Windows native rendered scrolling
        if: runner.os == 'Windows'
        run: |
          & (Join-Path 'scripts' 'check-scrolling.ps1')
      - name: Linux native rendered scrolling
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum pwsh -File (Join-Path 'scripts' 'check-scrolling.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Windows native smoke test
        if: runner.os == 'Windows'
        run: |
          & (Join-Path 'scripts' 'smoke.ps1') -Binary (Join-Path 'target' '${{ matrix.target }}' 'release' 'mdv.exe')
      - name: Linux native smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run --auto-servernum pwsh -File (Join-Path 'scripts' 'smoke.ps1') -Binary (Join-Path 'target' '${{ matrix.target }}' 'release' 'mdv')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        run: |
          & (Join-Path 'scripts' 'package.ps1') -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdv-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @files --title "MDV $env:RELEASE_TAG" --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
